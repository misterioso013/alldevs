name: checar
on: [push, pull_request]
jobs:
  checar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s fonte/testes -t fonte -v
      - run: python3 fonte/gerar.py && git diff --exit-code
      - run: python3 fonte/checar.py
