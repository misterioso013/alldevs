<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --bg2: #0e0e16;
    --surface: rgba(255,255,255,0.04);
    --surface2: rgba(255,255,255,0.07);
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.12);
    --purple: #7c3aed;
    --purple-light: #9d6bf0;
    --purple-glow: rgba(124,58,237,0.25);
    --orange: #f97316;
    --orange-light: #fb923c;
    --text: #eeeef5;
    --text2: #b0b0c0;
    --muted: #505065;
    --font-display: 'Syne', sans-serif;
    --font-body: 'DM Sans', sans-serif;
  }

  html { scroll-behavior: smooth; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    line-height: 1.6;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  ::-webkit-scrollbar { width: 3px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--purple); border-radius: 2px; }
  ::selection { background: var(--purple); color: #fff; }

  /* ── NAV ── */
  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    padding: 20px 48px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(10,10,15,0.9);
    backdrop-filter: blur(20px);
    border-bottom: 1px solid var(--border);
  }
  .nav-logo {
    font-family: var(--font-display); font-weight: 800; font-size: 1.1rem;
    letter-spacing: -0.02em; text-decoration: none; color: var(--text);
    display: flex; align-items: center; gap: 6px;
  }
  .nav-logo span { color: var(--purple); }
  .nav-back {
    display: inline-flex; align-items: center; gap: 6px;
    color: var(--text2); font-size: 0.85rem; font-weight: 500;
    text-decoration: none; transition: color 0.2s;
  }
  .nav-back:hover { color: var(--text); }

  /* ── HERO ── */
  #hist-hero {
    min-height: 70vh;
    display: flex; flex-direction: column;
    justify-content: flex-end; padding: 120px 80px 80px;
    position: relative; overflow: hidden;
  }
  .hist-hero-bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse 60% 60% at 80% 20%, rgba(124,58,237,0.15) 0%, transparent 60%),
      radial-gradient(ellipse 40% 40% at 20% 80%, rgba(249,115,22,0.08) 0%, transparent 60%);
  }
  .hist-hero-lines {
    position: absolute; inset: 0; overflow: hidden;
  }
  .hist-hero-lines::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0; width: 1px;
    background: linear-gradient(to bottom, transparent, var(--purple), transparent);
    left: 80px;
  }
  .hist-kicker {
    font-size: 0.75rem; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--orange-light);
    margin-bottom: 16px; position: relative; z-index: 1;
  }
  .hist-title {
    font-family: var(--font-display);
    font-size: clamp(3rem, 7vw, 6.5rem);
    font-weight: 800; letter-spacing: -0.04em;
    line-height: 0.95; position: relative; z-index: 1;
    margin-bottom: 24px;
  }
  .hist-title em {
    font-style: normal;
    -webkit-text-stroke: 1px var(--purple-light);
    -webkit-text-fill-color: transparent;
  }
  .hist-sub {
    font-size: 1.1rem; color: var(--text2); max-width: 500px;
    font-weight: 300; line-height: 1.65; position: relative; z-index: 1;
  }
  .hist-sub strong { color: var(--text); font-weight: 500; }

  /* ── HORIZONTAL MANIFESTO ── */
  .horizontal-story {
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    position: relative;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    background:
      radial-gradient(ellipse 46% 70% at 50% 50%, rgba(124,58,237,0.14), transparent 64%),
      linear-gradient(180deg, var(--bg), var(--bg2));
  }
  .horizontal-story::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle 1px at 1px 1px, rgba(255,255,255,0.1) 1px, transparent 0);
    background-size: 42px 42px;
    mask-image: radial-gradient(ellipse 82% 70% at 50% 50%, black 20%, transparent 100%);
    pointer-events: none;
  }
  .horizontal-story__kicker {
    position: absolute;
    left: 80px;
    top: 80px;
    color: var(--orange-light);
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    z-index: 1;
  }
  .horizontal-story__text {
    display: block;
    width: max-content;
    max-width: none;
    white-space: nowrap;
    padding-left: 0;
    font-family: var(--font-display);
    font-size: clamp(3rem, 10vw, 10rem);
    font-weight: 800;
    line-height: 0.92;
    letter-spacing: -0.04em;
    color: var(--text);
    font-kerning: none;
    text-rendering: optimizeSpeed;
    position: relative;
    z-index: 1;
    will-change: transform;
  }
  .horizontal-story__text em {
    font-style: normal;
    background: linear-gradient(135deg, var(--purple-light), var(--orange));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .story-word,
  .story-char {
    display: inline-block;
  }
  .story-word {
    margin-right: 0.25em;
  }
  .horizontal-story__text em .story-word,
  .horizontal-story__text em .story-char {
    background: inherit;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  @media (max-width: 768px), (prefers-reduced-motion: reduce) {
    .horizontal-story {
      min-height: auto;
      padding: 80px 24px;
      width: 100vw;
      max-width: 100vw;
    }
    .horizontal-story__kicker {
      position: relative;
      left: auto;
      top: auto;
      margin-bottom: 24px;
    }
    .horizontal-story {
      display: block;
    }
    .horizontal-story__text {
      display: block;
      width: calc(100vw - 48px) !important;
      max-width: calc(100vw - 48px) !important;
      white-space: normal;
      padding-left: 0;
      font-size: clamp(1.65rem, 6.5vw, 2.05rem);
      line-height: 1;
      overflow-wrap: anywhere;
      word-break: break-word;
      hyphens: auto;
      transform: none !important;
    }
    .horizontal-story__text .story-word,
    .horizontal-story__text .story-char {
      display: inline !important;
      margin-right: 0 !important;
      transform: none !important;
      opacity: 1 !important;
    }
  }

  /* ── TIMELINE ── */
  #timeline {
    padding: 100px 80px;
    max-width: 1100px;
    margin: 0 auto;
    position: relative;
  }
  @media (max-width: 768px) {
    #hist-hero { padding: 100px 24px 60px; }
    #timeline { padding: 60px 24px; }
  }

  /* vertical line */
  .tl-line {
    position: absolute;
    left: 140px; top: 0; bottom: 0; width: 1px;
    background: linear-gradient(to bottom, var(--border2), var(--purple), var(--orange), transparent);
    opacity: 0.4;
  }
  @media (max-width: 768px) { .tl-line { left: 20px; } }

  .tl-item {
    display: grid;
    grid-template-columns: 110px 1fr;
    gap: 48px;
    margin-bottom: 80px;
    position: relative;
    align-items: start;
  }
  @media (max-width: 768px) {
    .tl-item { grid-template-columns: 1fr; gap: 16px; padding-left: 44px; }
  }

  .tl-year-col {
    text-align: right;
    padding-top: 4px;
    position: relative;
  }
  .tl-year {
    font-family: var(--font-display);
    font-size: 0.85rem; font-weight: 700; color: var(--muted);
    letter-spacing: 0.06em;
    display: block;
  }
  /* dot on the line */
  .tl-dot {
    position: absolute;
    right: -37px; top: 14px;
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--bg);
    border: 2px solid var(--muted);
    transition: border-color 0.3s;
    z-index: 2;
  }
  .tl-item.active .tl-dot {
    border-color: var(--purple);
    box-shadow: 0 0 12px var(--purple-glow);
    background: var(--purple);
  }
  .tl-item.highlight .tl-dot {
    border-color: var(--orange);
    box-shadow: 0 0 12px var(--orange-glow, rgba(249,115,22,0.3));
    background: var(--orange);
  }
  @media (max-width: 768px) {
    .tl-year-col { text-align: left; }
    .tl-dot { right: auto; left: -30px; top: 8px; }
  }

  .tl-content {
    padding-bottom: 8px;
  }
  .tl-label {
    font-size: 0.68rem; font-weight: 700; letter-spacing: 0.12em;
    text-transform: uppercase; color: var(--purple-light);
    margin-bottom: 8px;
  }
  .tl-item.highlight .tl-label { color: var(--orange-light); }

  .tl-heading {
    font-family: var(--font-display);
    font-size: clamp(1.5rem, 3vw, 2.2rem);
    font-weight: 800; letter-spacing: -0.03em;
    line-height: 1.1; margin-bottom: 16px;
  }
  .tl-body {
    font-size: 0.95rem; color: var(--text2);
    line-height: 1.8; font-weight: 300;
    max-width: 520px;
  }
  .tl-body strong { color: var(--text); font-weight: 500; }
  .tl-body em { color: var(--orange-light); font-style: normal; }

  .tl-quote {
    margin-top: 20px;
    border-left: 2px solid var(--purple);
    padding: 12px 20px;
    background: var(--surface);
    border-radius: 0 8px 8px 0;
    font-size: 0.9rem; color: var(--text2); font-style: italic; line-height: 1.65;
  }
  .tl-item.highlight .tl-quote {
    border-color: var(--orange);
  }

  .tl-card {
    margin-top: 20px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 20px;
    display: inline-flex; align-items: center; gap: 12px;
    font-size: 0.85rem; color: var(--text2);
  }
  .tl-card-icon { font-size: 1.2rem; }
  .tl-card strong { color: var(--text); font-weight: 600; display: block; margin-bottom: 2px; font-size: 0.9rem; }

  /* ── CLOSING ── */
  #hist-closing {
    padding: 80px;
    background: var(--bg2);
    border-top: 1px solid var(--border);
    text-align: center;
    position: relative; overflow: hidden;
  }
  @media (max-width: 768px) { #hist-closing { padding: 60px 24px; } }
  .closing-glow {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 50% 80% at 50% 100%, rgba(124,58,237,0.15), transparent);
    pointer-events: none;
  }
  .closing-inner { position: relative; z-index: 1; max-width: 600px; margin: 0 auto; }
  .closing-title {
    font-family: var(--font-display);
    font-size: clamp(2rem, 4vw, 3.5rem);
    font-weight: 800; letter-spacing: -0.04em;
    line-height: 1.05; margin-bottom: 20px;
  }
  .closing-sub {
    font-size: 1rem; color: var(--text2); font-weight: 300;
    line-height: 1.7; margin-bottom: 36px;
  }
  .btn-primary {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--purple); color: #fff;
    font-weight: 600; font-size: 0.95rem; font-family: var(--font-body);
    padding: 14px 28px; border-radius: 10px;
    text-decoration: none;
    transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
  }
  .btn-primary:hover {
    background: var(--purple-light);
    transform: translateY(-2px);
    box-shadow: 0 8px 30px var(--purple-glow);
  }
  .btn-ghost {
    display: inline-flex; align-items: center; gap: 8px;
    background: var(--surface);
    color: var(--text); font-weight: 500; font-size: 0.95rem;
    font-family: var(--font-body);
    padding: 14px 28px; border-radius: 10px;
    text-decoration: none; border: 1px solid var(--border2);
    transition: background 0.2s, transform 0.15s;
    margin-left: 12px;
  }
  .btn-ghost:hover { background: var(--surface2); transform: translateY(-2px); }

  /* ── WA FLOAT ── */
  .wa-float {
    position: fixed; bottom: 28px; right: 28px; z-index: 200;
    width: 54px; height: 54px; border-radius: 50%;
    background: #25d366;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 20px rgba(37,211,102,0.4);
    text-decoration: none;
    transition: transform 0.2s;
    animation: wa-pulse 3s ease-in-out infinite;
  }
  .wa-float:hover { transform: scale(1.1); }
  @keyframes wa-pulse {
    0%, 100% { box-shadow: 0 4px 20px rgba(37,211,102,0.4); }
    50% { box-shadow: 0 4px 30px rgba(37,211,102,0.6), 0 0 0 8px rgba(37,211,102,0.1); }
  }

  /* ── CUSTOM CURSOR ── */
  .cursor-aura,
  .cursor-dot {
    position: fixed;
    top: 0;
    left: 0;
    pointer-events: none;
    z-index: 10000;
    opacity: 0;
    transform: translate(-50%, -50%);
    will-change: transform, opacity;
  }
  .cursor-aura {
    width: 44px;
    height: 44px;
    border: 1px solid rgba(157,107,240,0.65);
    border-radius: 50%;
    background:
      radial-gradient(circle, rgba(124,58,237,0.16) 0%, rgba(124,58,237,0.04) 45%, transparent 72%);
    box-shadow: 0 0 24px rgba(124,58,237,0.18);
    mix-blend-mode: screen;
  }
  .cursor-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--purple-light), var(--orange));
    box-shadow: 0 0 18px rgba(249,115,22,0.35);
  }
  .cursor-aura.is-active,
  .cursor-dot.is-active {
    opacity: 1;
  }
  .cursor-aura.is-hovering {
    border-color: rgba(249,115,22,0.85);
    background:
      radial-gradient(circle, rgba(249,115,22,0.18) 0%, rgba(124,58,237,0.08) 50%, transparent 74%);
  }
  @media (hover: none), (pointer: coarse), (prefers-reduced-motion: reduce) {
    .cursor-aura,
    .cursor-dot {
      display: none;
    }
  }

  /* ── ANIMATIONS ── */
  .reveal { opacity: 0; transform: translateY(30px); }
</style>

<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3/dist/SplitText.min.js"></script>
<script>
gsap.registerPlugin(ScrollTrigger);
if (typeof SplitText !== 'undefined') {
  gsap.registerPlugin(SplitText);
}

// Hero entrance
gsap.timeline({ defaults: { ease: 'power3.out' } })
  .from('#hk', { y: 20, opacity: 0, duration: 0.6, delay: 0.3 })
  .from('#ht', { y: 50, opacity: 0, duration: 1 }, '-=0.3')
  .from('#hs', { y: 30, opacity: 0, duration: 0.7 }, '-=0.5');

// Reveal on scroll
gsap.utils.toArray('.reveal').forEach(el => {
  gsap.fromTo(el,
    { y: 40, opacity: 0 },
    {
      y: 0, opacity: 1, duration: 0.85, ease: 'power3.out',
      scrollTrigger: { trigger: el, start: 'top 88%', toggleActions: 'play none none none' }
    }
  );
});

// Activate timeline items (glow dots) as they enter
document.querySelectorAll('.tl-item').forEach(item => {
  ScrollTrigger.create({
    trigger: item,
    start: 'top 70%',
    onEnter: () => item.classList.add('active'),
  });
});

// Subtle parallax on hero glows
window.addEventListener('mousemove', e => {
  const x = (e.clientX / window.innerWidth - 0.5) * 20;
  const y = (e.clientY / window.innerHeight - 0.5) * 15;
  gsap.to('.hist-hero-bg', { x: x * 0.3, y: y * 0.3, duration: 2, ease: 'power1.out' });
});

// Horizontal SplitText manifesto
(function() {
  const wrapper = document.querySelector('.horizontal-story');
  const text = document.querySelector('.horizontal-story__text');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const isMobile = window.matchMedia('(max-width: 768px)').matches;
  if (!wrapper || !text || reduceMotion || isMobile) return;

  function splitCharsFallback(el) {
    const rawText = el.textContent.trim();
    const words = rawText.split(/\s+/);
    const chars = [];
    el.setAttribute('aria-label', rawText);
    el.textContent = '';

    words.forEach((word, wordIndex) => {
      const wordEl = document.createElement('span');
      wordEl.className = 'story-word';
      wordEl.setAttribute('aria-hidden', 'true');

      Array.from(word).forEach(char => {
        const charEl = document.createElement('span');
        charEl.className = 'story-char';
        charEl.textContent = char;
        wordEl.appendChild(charEl);
        chars.push(charEl);
      });

      el.appendChild(wordEl);
      if (wordIndex < words.length - 1) el.append(' ');
    });

    return chars;
  }

  function initHorizontalStory() {
    const split = typeof SplitText !== 'undefined'
      ? SplitText.create(text, {
          type: 'words, chars',
          wordsClass: 'story-word',
          charsClass: 'story-char',
          tag: 'span',
          aria: 'auto'
        })
      : { chars: splitCharsFallback(text) };

    const startX = () => window.innerWidth * 0.12;
    const endX = () => {
      const travel = text.scrollWidth - window.innerWidth + window.innerWidth * 0.12;
      return -Math.max(travel, window.innerWidth * 0.7);
    };

    const scrollTween = gsap.fromTo(text, {
      x: startX
    }, {
      x: endX,
      ease: 'none',
      scrollTrigger: {
        trigger: wrapper,
        pin: true,
        scrub: true,
        end: () => '+=' + Math.max(2400, text.scrollWidth * 0.85),
        invalidateOnRefresh: true
      }
    });

    split.chars.forEach(char => {
      gsap.from(char, {
        yPercent: 'random(-180, 180)',
        rotation: 'random(-18, 18)',
        opacity: 0.35,
        ease: 'back.out(1.2)',
        scrollTrigger: {
          trigger: char,
          containerAnimation: scrollTween,
          start: 'left 100%',
          end: 'left 35%',
          scrub: 1
        }
      });
    });
  }

  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(initHorizontalStory);
  } else {
    initHorizontalStory();
  }
})();

// Custom cursor aura
(function() {
  const canUseCursor = window.matchMedia('(hover: hover) and (pointer: fine)').matches;
  const allowsMotion = window.matchMedia('(prefers-reduced-motion: no-preference)').matches;
  if (!canUseCursor || !allowsMotion) return;

  const aura = document.createElement('div');
  const dot = document.createElement('div');
  aura.className = 'cursor-aura';
  dot.className = 'cursor-dot';
  document.body.append(aura, dot);
  gsap.set([aura, dot], { xPercent: -50, yPercent: -50 });

  const auraX = gsap.quickTo(aura, 'x', { duration: 0.45, ease: 'power3.out' });
  const auraY = gsap.quickTo(aura, 'y', { duration: 0.45, ease: 'power3.out' });
  const dotX = gsap.quickTo(dot, 'x', { duration: 0.12, ease: 'power2.out' });
  const dotY = gsap.quickTo(dot, 'y', { duration: 0.12, ease: 'power2.out' });

  window.addEventListener('pointermove', e => {
    auraX(e.clientX);
    auraY(e.clientY);
    dotX(e.clientX);
    dotY(e.clientY);
    aura.classList.add('is-active');
    dot.classList.add('is-active');
  });

  document.addEventListener('pointerleave', () => {
    aura.classList.remove('is-active');
    dot.classList.remove('is-active');
  });

  document.querySelectorAll('a, button, .tl-card, .tl-item').forEach(el => {
    el.addEventListener('pointerenter', () => {
      aura.classList.add('is-hovering');
      gsap.to(aura, { scale: 1.85, duration: 0.22, ease: 'power2.out' });
      gsap.to(dot, { scale: 0.6, duration: 0.18, ease: 'power2.out' });
    });
    el.addEventListener('pointerleave', () => {
      aura.classList.remove('is-hovering');
      gsap.to(aura, { scale: 1, duration: 0.28, ease: 'power2.out' });
      gsap.to(dot, { scale: 1, duration: 0.18, ease: 'power2.out' });
    });
  });
})();
</script>
