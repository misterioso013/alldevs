$cabecalho
<main data-molde="perfil">
<section class="perfil-apresentacao" data-secao="apresentacao" aria-label="Apresentação">
  <img class="perfil-foto" src="/$foto" alt="Foto de $nome" width="$foto_w" height="$foto_h" fetchpriority="high">
  <div class="perfil-texto">
    <p class="rotulo-mono">$papel_mono</p>
    <h1>$nome</h1>
    <p class="perfil-papel">Sócio · $papel</p>
    <p class="perfil-frase">$frase</p>
  </div>
</section>

<section class="perfil-faz" data-secao="faz">
  <p class="rotulo-mono">// o que eu faço</p>
  <h2 class="titulo-revela">O que eu faço</h2>
  <ul>
$faz
  </ul>$links$historia
</section>

<section class="perfil-projetos" data-secao="projetos">
  <p class="rotulo-mono">// fizemos juntos</p>
  <h2 class="titulo-revela">Fizemos juntos</h2>
  <div class="grade-projetos">
$projetos
  </div>
</section>

<section class="contato" data-secao="contato">
  <p class="rotulo-mono">// contato</p>
  <h2 class="titulo-revela">Fale com a AllDevs</h2>
$contato
</section>
</main>$revelar
$rodape
