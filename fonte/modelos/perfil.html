$cabecalho
<main data-molde="perfil">
<section class="perfil-apresentacao" data-secao="apresentacao">
  <p class="rotulo-mono">$papel_mono</p>
  <h1>$nome</h1>
  <p class="perfil-papel">Sócio · $papel</p>
  <img class="perfil-foto" src="/$foto" alt="Foto de $nome" width="320" height="320" fetchpriority="high">
  <p class="perfil-frase">$frase</p>
$links$historia
</section>

<section class="perfil-faz" data-secao="faz">
  <p class="rotulo-mono">// o que eu faço</p>
  <h2>O que eu faço</h2>
  <ul>
$faz
  </ul>
</section>

<section class="perfil-projetos" data-secao="projetos">
  <p class="rotulo-mono">// projetos de $nome</p>
  <h2>Projetos</h2>
  <div class="grade-projetos">
$projetos
  </div>
</section>

<section class="contato" data-secao="contato">
  <p class="rotulo-mono">// contato</p>
  <h2>Fale com a AllDevs</h2>
$contato
</section>
</main>
$rodape
